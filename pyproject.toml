[project]
name = "clamshell"
version = "0.1.0"
description = "A custom shell with smart autocomplete and zoxide-style directory jumping"
requires-python = ">=3.11"
dependencies = [
    "textual>=8.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
clamshell = "clamshell.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clamshell = ["completions/data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
